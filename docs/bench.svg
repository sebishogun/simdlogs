<svg xmlns="http://www.w3.org/2000/svg" width="640" height="228" font-family="system-ui,-apple-system,sans-serif" font-size="13">
<style>text{fill:#222}.mut{fill:#888}@media(prefers-color-scheme:dark){text{fill:#e0e0e0}.mut{fill:#999}}</style>
<text x="14" y="26" font-size="15" font-weight="700">simdlogs vs VictoriaLogs — 3M rows</text>
<text x="14" y="46" class="mut" font-size="12">query latency, lower is better; same corpus, same machine, identical wire calls</text>
<text x="14" y="84">common-value query</text>
<rect x="200" y="73" width="188" height="13" rx="2" fill="#3aa675"/>
<text x="394" y="84" font-size="11">ours 6  <tspan font-weight="700">1.9x slower</tspan></text>
<rect x="200" y="89" width="360" height="10" rx="2" fill="#bbb"/>
<text x="566" y="98" class="mut" font-size="10">VictoriaLogs 11</text>
<text x="14" y="130">aggregation (hits)</text>
<rect x="200" y="119" width="53" height="13" rx="2" fill="#3aa675"/>
<text x="259" y="130" font-size="11">ours 2  <tspan font-weight="700">2.1x slower</tspan></text>
<rect x="200" y="135" width="109" height="10" rx="2" fill="#bbb"/>
<text x="315" y="144" class="mut" font-size="10">VictoriaLogs 3</text>
<text x="14" y="176">rare needle</text>
<rect x="200" y="165" width="29" height="13" rx="2" fill="#c65"/>
<text x="235" y="176" font-size="11">ours 1  <tspan font-weight="700">2.1x</tspan></text>
<rect x="200" y="181" width="14" height="10" rx="2" fill="#bbb"/>
<text x="220" y="190" class="mut" font-size="10">VictoriaLogs 0</text>
</svg>