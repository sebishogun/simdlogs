<svg xmlns="http://www.w3.org/2000/svg" width="640" height="274" font-family="system-ui,-apple-system,sans-serif" font-size="13">
<style>text{fill:#222}.mut{fill:#888}@media(prefers-color-scheme:dark){text{fill:#e0e0e0}.mut{fill:#999}}</style>
<text x="14" y="26" font-size="15" font-weight="700">simdlogs vs VictoriaLogs — 3M rows</text>
<text x="14" y="46" class="mut" font-size="12">query latency, lower is better; same corpus, same machine, identical wire calls</text>
<text x="14" y="84">selective query</text>
<rect x="200" y="73" width="82" height="13" rx="2" fill="#3aa675"/>
<text x="288" y="84" font-size="11">ours 2  <tspan font-weight="700">4.4x</tspan></text>
<rect x="200" y="89" width="360" height="10" rx="2" fill="#bbb"/>
<text x="566" y="98" class="mut" font-size="10">VictoriaLogs 11</text>
<text x="14" y="130">aggregation (hits)</text>
<rect x="200" y="119" width="55" height="13" rx="2" fill="#3aa675"/>
<text x="261" y="130" font-size="11">ours 2  <tspan font-weight="700">2.0x</tspan></text>
<rect x="200" y="135" width="109" height="10" rx="2" fill="#bbb"/>
<text x="315" y="144" class="mut" font-size="10">VictoriaLogs 3</text>
<text x="14" y="176">rare needle</text>
<rect x="200" y="165" width="32" height="13" rx="2" fill="#c65"/>
<text x="238" y="176" font-size="11">ours 1  <tspan font-weight="700">2.8x slower</tspan></text>
<rect x="200" y="181" width="11" height="10" rx="2" fill="#bbb"/>
<text x="217" y="190" class="mut" font-size="10">VictoriaLogs 0</text>
<text x="14" y="222">full-scan count (engine)</text>
<rect x="200" y="211" width="15" height="13" rx="2" fill="#3aa675"/>
<text x="221" y="222" font-size="11">ours 0  <tspan font-weight="700">3.7x</tspan></text>
<rect x="200" y="227" width="57" height="10" rx="2" fill="#bbb"/>
<text x="263" y="236" class="mut" font-size="10">serial 2</text>
</svg>