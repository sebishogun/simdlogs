<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simdlogs</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --line: #e2e2e2;
    --accent: #2563eb; --bar: #93c5fd; --err: #dc2626; --card: #f7f7f8;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --fg: #e6e6e6; --muted: #9aa0aa; --line: #262b33;
      --accent: #60a5fa; --bar: #1e3a8a; --err: #f87171; --card: #171a21;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--fg); }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .tag { color: var(--muted); font-size: 12px; }
  main { padding: 16px 18px; max-width: 1200px; margin: 0 auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  input, select, button { font: inherit; color: var(--fg); background: var(--bg);
         border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  #q { flex: 1 1 420px; font-family: var(--mono); }
  input[type=datetime-local] { color-scheme: light dark; }
  button { background: var(--accent); color: #fff; border-color: transparent; cursor: pointer; font-weight: 600; }
  button.secondary { background: var(--card); color: var(--fg); border-color: var(--line); font-weight: 500; }
  button:active { transform: translateY(1px); }
  .muted { color: var(--muted); }
  #status { min-height: 18px; font-size: 12.5px; }
  #status.error { color: var(--err); }
  #hist { display: flex; align-items: flex-end; gap: 1px; height: 60px; margin: 6px 0 14px;
          border-bottom: 1px solid var(--line); }
  #hist .b { flex: 1; background: var(--bar); min-height: 1px; border-radius: 2px 2px 0 0; }
  table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12.5px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line); vertical-align: top;
           white-space: nowrap; max-width: 480px; overflow: hidden; text-overflow: ellipsis; }
  th { position: sticky; top: 0; background: var(--card); font-weight: 600; }
  tr:hover td { background: var(--card); }
  td.time { color: var(--muted); }
  .examples { font-size: 12px; }
  .examples code { font-family: var(--mono); background: var(--card); padding: 1px 5px; border-radius: 4px;
                   cursor: pointer; border: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>simdlogs</h1>
  <span class="tag">LogsQL explorer</span>
</header>
<main>
  <div class="row">
    <input id="q" placeholder='LogsQL, e.g.  level:=error  |  service:=api and status:>=500  |  * | stats by (level) count()' spellcheck="false">
    <button id="run">Run</button>
  </div>
  <div class="row">
    <label class="muted">from <input type="datetime-local" id="start"></label>
    <label class="muted">to <input type="datetime-local" id="end"></label>
    <label class="muted">limit <input id="limit" type="number" value="200" min="1" style="width:90px"></label>
    <button class="secondary" id="clear">Clear time</button>
    <button class="secondary" id="more" hidden>Load more</button>
    <button class="secondary" id="cancel" hidden>Cancel</button>
  </div>
  <div class="examples muted">
    try:
    <code>level:=error</code>
    <code>_msg:~"timeout"</code>
    <code>* | stats by (service) count() as c | sort by (c) desc | limit 10</code>
    <code>_stream:{service="api"}</code>
  </div>
  <div id="hist"></div>
  <div id="status" class="muted"></div>
  <div class="tablewrap"><table id="out"></table></div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var q = $("q"), out = $("out"), status = $("status"), hist = $("hist");

  // No tenant selector.
  //
  // It sent an arbitrary AccountID header, so on a deployment without
  // -auth.config the UI was a free tenant switcher -- pick "tenant 3" from a
  // dropdown and read someone else's logs. With auth configured the resolver
  // refused it, which made the control a dropdown that produced 403s. Either
  // way the answer is the same: the tenant is whatever the CREDENTIAL
  // resolves to, decided by the server, and the browser does not get a say.
  function headers() { return {}; }
  function toNano(v) { // datetime-local -> unix ns, or ""
    if (!v) return "";
    var ms = new Date(v).getTime();
    return isNaN(ms) ? "" : String(ms * 1000000);
  }
  function params() {
    var p = new URLSearchParams();
    p.set("query", q.value || "*");
    var s = toNano($("start").value), e = toNano($("end").value);
    if (s) p.set("start", s);
    if (e) p.set("end", e);
    return p;
  }
  function setStatus(msg, isErr) {
    status.textContent = msg;
    status.className = isErr ? "error" : "muted";
  }

  function renderRows(text, append) {
    var lines = text.split("\n").filter(function (l) { return l.trim() !== ""; });
    var rows = [];
    var keys = [];
    var seen = {};
    lines.forEach(function (l) {
      var obj;
      try { obj = JSON.parse(l); } catch (e) { return; }
      rows.push(obj);
      Object.keys(obj).forEach(function (k) {
        if (k !== "_time" && !seen[k]) { seen[k] = true; keys.push(k); }
      });
    });
    keys.sort();
    var cols = ["_time"].concat(keys);
    var html = "<thead><tr>";
    cols.forEach(function (c) { html += "<th>" + esc(c) + "</th>"; });
    html += "</tr></thead><tbody>";
    rows.forEach(function (r) {
      html += "<tr>";
      cols.forEach(function (c) {
        var cls = c === "_time" ? ' class="time"' : "";
        html += "<td" + cls + ">" + esc(r[c] === undefined ? "" : String(r[c])) + "</td>";
      });
      html += "</tr>";
    });
    html += "</tbody>";
    if (append) {
      // Append the body rows to the existing table rather than replacing it,
      // so paging does not throw away what the reader is looking at.
      var tb = out.querySelector("tbody");
      if (tb) {
        var tmp = document.createElement("table");
        tmp.innerHTML = html;
        var add = tmp.querySelector("tbody");
        while (add && add.firstChild) { tb.appendChild(add.firstChild); }
        return rows.length;
      }
    }
    out.innerHTML = html;
    return rows.length;
  }

  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // The histogram reads the shape the endpoint actually returns.
  //
  // It read `j.hits[i]._time` and `.hits` -- a bag of {time, count} objects.
  // /select/logsql/hits returns the reference's DENSE shape: one entry per
  // series, each with parallel `timestamps` and `values` arrays. So every
  // `h.hits` was undefined, `max` stayed 1, every bar computed a NaN height,
  // and the graph was permanently empty. It failed silently because the
  // catch() swallowed everything, including the error that would have said so.
  function loadHist(signal) {
    hist.innerHTML = "";
    var p = params();
    // A window, always, and a step that fits it.
    //
    // The histogram response is DENSE -- one bucket per step across the whole
    // window whether or not anything is in it -- so its size is (window /
    // step) and has nothing to do with how much data matched. With no window
    // the page was asking for a bucket per minute since 1970: about 29 million
    // of them, tens of megabytes, on every page load against an empty store.
    var s = toNano($("start").value), e = toNano($("end").value);
    var toN = e ? Number(e) : Date.now() * 1e6;
    var fromN = s ? Number(s) : toN - 3600 * 1e9; // one hour by default
    p.set("start", String(fromN));
    p.set("end", String(toN));
    // ~120 buckets across whatever window is showing, so the step follows the
    // range instead of being fixed at a minute.
    var stepNs = Math.max(1e9, Math.round((toN - fromN) / 120));
    p.set("step", Math.round(stepNs / 1e6) + "ms");
    fetch("/select/logsql/hits?" + p.toString(), { headers: headers(), signal: signal })
      .then(function (r) {
        if (!r.ok) { return r.text().then(function (t) { throw new Error(t || r.status); }); }
        return r.json();
      })
      .then(function (j) {
        var series = (j && j.hits) || [];
        // Buckets summed ACROSS series: the endpoint splits by `field` when
        // asked, and the UI asks for one graph.
        var buckets = {};
        series.forEach(function (se) {
          var ts = se.timestamps || [], vs = se.values || [];
          for (var i = 0; i < ts.length && i < vs.length; i++) {
            buckets[ts[i]] = (buckets[ts[i]] || 0) + vs[i];
          }
        });
        var keys = Object.keys(buckets).sort();
        if (!keys.length) { return; }
        var max = 1;
        keys.forEach(function (k) { if (buckets[k] > max) max = buckets[k]; });
        keys.forEach(function (k) {
          var b = document.createElement("div");
          b.className = "b";
          b.style.height = Math.max(1, Math.round((buckets[k] / max) * 58)) + "px";
          b.title = k + ": " + buckets[k];
          hist.appendChild(b);
        });
      })
      .catch(function (e) {
        if (e && e.name === "AbortError") { return; }
        // Reported, not swallowed. A silent catch is why the histogram was
        // broken for as long as it was.
        hist.textContent = "histogram unavailable: " + (e.message || e);
      });
  }

  // Cancellation and pagination.
  //
  // A query with no cancel is a query the browser cannot stop: the tab holds
  // the connection, the server keeps scanning, and clicking Run again just
  // starts a second one. The server already ends a scan whose client hangs up
  // (its context is the request's), so an AbortController is the whole
  // mechanism -- it just was not wired to anything.
  var inflight = null;
  var cursor = "";

  function run(append) {
    if (inflight) { inflight.abort(); }
    inflight = new AbortController();
    $("cancel").hidden = false;
    setStatus(append ? "loading more..." : "running...");
    if (!append) { out.innerHTML = ""; cursor = ""; $("more").hidden = true; }

    var p = params();
    p.set("page_size", $("limit").value || "200");
    if (append && cursor) { p.set("cursor", cursor); }
    var t0 = performance.now();
    var signal = inflight.signal;

    fetch("/select/logsql/query?" + p.toString(), { headers: headers(), signal: signal })
      .then(function (r) {
        if (!r.ok) { return r.text().then(function (t) { throw new Error(t || r.status); }); }
        // The next page's cursor is a header, not a body field: the body is
        // NDJSON and a trailing object of another shape is a row to anything
        // reading the stream.
        cursor = r.headers.get("X-Simdlogs-Cursor") || "";
        return r.text();
      })
      .then(function (text) {
        var n = renderRows(text, append);
        var ms = Math.round(performance.now() - t0);
        setStatus(n + " rows in " + ms + " ms" + (cursor ? " (more available)" : ""));
        $("more").hidden = !cursor;
        $("cancel").hidden = true;
        inflight = null;
        if (!append) { loadHist(signal); }
      })
      .catch(function (e) {
        $("cancel").hidden = true;
        inflight = null;
        if (e && e.name === "AbortError") { setStatus("cancelled"); return; }
        setStatus(String(e.message || e), true);
      });
  }

  $("run").addEventListener("click", function () { run(false); });
  $("more").addEventListener("click", function () { run(true); });
  $("cancel").addEventListener("click", function () {
    if (inflight) { inflight.abort(); }
  });
  q.addEventListener("keydown", function (e) { if (e.key === "Enter") run(false); });
  $("clear").addEventListener("click", function () { $("start").value = ""; $("end").value = ""; });
  Array.prototype.forEach.call(document.querySelectorAll(".examples code"), function (c) {
    c.addEventListener("click", function () { q.value = c.textContent; run(false); });
  });

  q.value = "*";
  run(false);
})();
</script>
</body>
</html>
